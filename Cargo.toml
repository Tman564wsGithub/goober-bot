[package]
edition = "2024"
name = "goober-bot"
version = "0.1.0"
license = "MIT"

[dependencies]
color-eyre = "0.6.5"
dashmap = "6.2.1"
dotenvy = "0.15.7"
poise = "0.7.1"
serenity = { version = "0.12.5", features = ["voice"] }
songbird = { version = "0.6.1", features = ["gateway", "serenity", "receive"] }
tokio = { version = "1.54.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[profile.release]
strip = true
panic = "abort"

[profile.dist]
inherits = "release"
codegen-units = 1
lto = true

[lints.clippy]
# Recommended config from No Boilerplate
pedantic = { level = "deny", priority = -1 } # UM, ACTUALLY
nursery = { level = "deny", priority = -1 }  # BETA LINTS

# DENY PANICS
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
unreachable = "deny"
unimplemented = "deny"
unchecked_time_subtraction = "deny"
todo = "deny"
string_slice = "deny"
panic_in_result_fn = "deny"
panic = "deny"
exit = "deny"
as_conversions = "deny"
